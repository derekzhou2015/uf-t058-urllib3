repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: f22ea0651f4355c655cc581f67813c991c74a312 # frozen: v3.22.0
    hooks:
      - id: pyupgrade
        args: ["--py310-plus"]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: a5439e9af2ff9371297bb1a76a01b8ad17989b88 # frozen: 26.10.1
    hooks:
      - id: black
        args: ["--target-version", "py310"]

  - repo: https://github.com/PyCQA/isort
    rev: 9f905615631c545f5aea2516508109350d1d2f7d # frozen: 9.0.2
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/flake8
    rev: 1c7fec1973ed3a7c192dbe1e96906fbbd1dbe49e # frozen: 7.5.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-2020]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: d1df990f871e616da38bb602a2671d5e840b9989 # frozen: 0.13.7
    hooks:
      - id: uv-lock

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --list-different --ignore-unknown
        language: node
        additional_dependencies: ["prettier@3.9.9"]
        types_or: [javascript]

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: 28bccd32cd8c825b0d0913b486f8ef0f56bfb08a # frozen: v10.14.0
    hooks:
      - id: eslint
        args: ["--fix"]
        additional_dependencies:
          # Configuring additional dependencies replaces the hook defaults,
          # so ESLint itself must be included explicitly.
          - "eslint@10.14.0"
          # ESLint 10 flat config provides recommended rules and worker globals
          # through these separate packages.
          - "@eslint/js@10.0.1"
          - "globals@17.14.0"
